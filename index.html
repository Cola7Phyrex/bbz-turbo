<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1620">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Mega Gather & Blust: Turbo</title>
  <style>
    @font-face{font-family:TurboPixel;src:url('fonts/ZLabsRoundPix.woff2') format('woff2');font-display:swap}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b1620;color:#eef2ed;font-family:TurboPixel,monospace;touch-action:none;-webkit-user-select:none;user-select:none}
    #game{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #canvas{display:block;width:100%;height:100%;outline:none}
    .overlay{position:fixed;inset:0;background:#0b1620;display:flex;align-items:center;justify-content:center;z-index:3;padding:28px;text-align:center}
    .load-card{position:relative;width:min(100%,400px);padding:40px 24px 32px;background:#101f2b;border:4px solid #617889;box-shadow:8px 8px 0 #050d14;display:flex;flex-direction:column;align-items:center;gap:20px}
    .load-card::before,.load-card::after{content:'';position:absolute;width:12px;height:12px;background:#edbc55}
    .load-card::before{top:-4px;left:-4px}.load-card::after{bottom:-4px;right:-4px}
    .brand{font-size:12px;line-height:24px;letter-spacing:1px;color:#a7b8c8}.title{font-size:64px;line-height:1;letter-spacing:4px;color:#edbc55;font-weight:400;text-shadow:4px 4px 0 #050d14}
    p{margin:0;font-size:16px;line-height:24px;color:#a7b8c8}
    button{font:inherit;font-size:16px;line-height:24px;cursor:pointer;border:3px solid #617889;border-radius:0;color:#eef2ed;background:#142332;padding:12px 28px;box-shadow:4px 4px 0 #050d14;touch-action:manipulation}
    #enter{width:100%;border-color:#edbc55;color:#edbc55}button:disabled{opacity:.4;cursor:wait}button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #050d14;background:#233746}
    .progress-track{width:100%;height:20px;margin-top:8px;padding:3px;border:2px solid #617889;background:#050d14;text-align:left;overflow:hidden}
    #progress-fill{display:block;width:0;height:100%;background:repeating-linear-gradient(90deg,#edbc55 0,#edbc55 10px,transparent 10px,transparent 14px)}
    .progress-track:not([aria-valuenow]) #progress-fill{width:28%;animation:loading 1.2s steps(8,end) infinite}
    @keyframes loading{from{transform:translateX(-100%)}to{transform:translateX(360%)}}
    @media(prefers-reduced-motion:reduce){.progress-track:not([aria-valuenow]) #progress-fill{animation:none;width:100%}}
    @media(max-height:480px){.load-card{padding:16px 24px;gap:10px}.title{font-size:48px}.progress-track{margin-top:0}}
    #fullscreen{position:fixed;right:calc(env(safe-area-inset-right) + 8px);bottom:calc(env(safe-area-inset-bottom) + 2px);font-size:11px;padding:3px 10px;background:#0b1620b0;border-color:#617889;z-index:2}
    [hidden]{display:none!important}
  </style>
  
</head>
<body>
  <div id="game"><canvas id="canvas" tabindex="0">浏览器需要支持 WebGL 2。</canvas></div>
  <div id="loading" class="overlay">
    <div class="load-card">
      <span class="brand">MEGA GATHER &amp; BLUST</span><span class="title">TURBO</span>
      <div id="progress" class="progress-track" role="progressbar" aria-label="游戏加载进度" aria-valuemin="0" aria-valuemax="100"><span id="progress-fill"></span></div>
      <p id="message" role="status">正在加载</p>
      <button id="enter" disabled>进入游戏</button>
    </div>
  </div>
  <button id="fullscreen" aria-label="切换全屏">全屏</button>
  <noscript>请开启 JavaScript 后游玩。</noscript>
  <script src="index.js"></script>
  <script>
    // The compressed engine keeps the mobile download small and fits static hosting limits.
    const nativeFetch = window.fetch.bind(window);
    window.fetch = async (input, options) => {
      const url = typeof input === 'string' ? input : input.url;
      if (new URL(url, location.href).pathname.endsWith('/index.wasm')) {
        const response = await nativeFetch('index.wasm.gz', options);
        if (!response.ok) throw new Error('引擎下载失败，请刷新重试');
        return new Response(response.body.pipeThrough(new DecompressionStream('gzip')), {headers:{'Content-Type':'application/wasm'}});
      }
      if (new URL(url, location.href).pathname.endsWith('/index.pck')) {
        const size = config.fileSizes['index.pck'];
        const count = Math.ceil(size / (16 * 1024 * 1024));
        const responses = await Promise.all(Array.from({length:count}, (_, i) => nativeFetch(`index.pck.part${i}`, options)));
        if (responses.some(response => !response.ok)) throw new Error('游戏资源下载失败，请刷新重试');
        const readers = responses.map(response => response.body.getReader());
        let index = 0;
        const stream = new ReadableStream({
          async pull(controller) {
            while (index < readers.length) {
              const chunk = await readers[index].read();
              if (chunk.done) { index++; continue; }
              controller.enqueue(chunk.value);
              return;
            }
            controller.close();
          },
          cancel(reason) { return Promise.all(readers.map(reader => reader.cancel(reason))); }
        });
        return new Response(stream, {headers:{'Content-Type':'application/octet-stream', 'Content-Length':String(size)}});
      }
      return nativeFetch(input, options);
    };
    const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":28294172,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const engine = new Engine(config);
    const message = document.getElementById('message');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progress-fill');
    const enter = document.getElementById('enter');
    const canvas = document.getElementById('canvas');
    const coarse = matchMedia('(pointer:coarse)');
    function suspendWhenNeeded(){
      if (document.hidden) window.turboSuspend?.();
    }
    document.addEventListener('visibilitychange', suspendWhenNeeded);
    window.addEventListener('resize', suspendWhenNeeded);
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    async function fullscreen(){
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (_) { /* Fullscreen is optional on browsers without support. */ }
    }
    document.getElementById('fullscreen').addEventListener('click', fullscreen);
    enter.addEventListener('click', () => {
      document.getElementById('loading').hidden = true;
      canvas.focus();
    });
    async function boot(){
      if (!('DecompressionStream' in window)) throw new Error('请使用较新版本的手机浏览器');
      const missing = Engine.getMissingFeatures({threads:false});
      if (missing.length) throw new Error('浏览器不支持 WebGL 2 或 WebAssembly');
      await engine.startGame({onProgress(current,total){
        if(total>0){
          const percent=Math.min(100,Math.round(current/total*100));
          progress.setAttribute('aria-valuenow',String(percent));
          progressFill.style.width=percent+'%';
        }
      }});
      progress.setAttribute('aria-valuenow','100');progressFill.style.width='100%';
      message.textContent='波波攒 · 威力加强版'; enter.disabled=false;
    }
    boot().catch(error=>{progress.hidden=true;message.textContent=error.message;console.error(error);});
  </script>
</body>
</html>
